apiVersion: apps/v1
kind: Deployment

metadata:
  name: chocolate-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: chocolate

  template:
    metadata:
      labels:
        app: chocolate

    spec:
      containers:
        - name: chocolate-container

          image: nginx:alpine

          ports:
            - containerPort: 80

          volumeMounts:
            - name: website-content
              mountPath: /usr/share/nginx/html
              readOnly: true

      volumes:
        - name: website-content
          configMap:
            name: chocolate-website